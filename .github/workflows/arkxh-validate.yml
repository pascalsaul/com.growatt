name: Validate ARK-XH Homey app

on:
  pull_request:
    branches:
      - custom/ark-xh
  push:
    branches:
      - custom/ark-xh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Homey CLI
        run: npm install --global homey

      - name: Validate Homey app
        run: homey app validate

      - name: Run upstream tests when present
        run: npm test --if-present
